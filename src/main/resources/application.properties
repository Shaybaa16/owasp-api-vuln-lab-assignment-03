# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# WARNING: Intentionally weak JWT secret (VULNERABILITY: API8-Weak Authentication)
# app.jwt.secret=secret123
# Unreasonably long token validity (VULNERABILITY: API8)
# app.jwt.ttl-seconds=2592000
# SECURITY FIX: JWT Hardening - Use strong secret from environment and short TTL
app.jwt.secret=${JWT_SECRET:MySuperSecureJWTSecretKeyFor2025!@}
app.jwt.expiration-ms=900000  # 15 minutes
app.jwt.issuer=owasp-api-lab

# Expose error details (VULNERABILITY: API7-Security Misconfiguration)
# server.error.include-message=always
# server.error.include-stacktrace=always

logging.level.root=INFO

# SECURITY FIX: Reduce error detail exposure in production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# SECURITY FIX: Configure secure logging
logging.level.edu.nu.owaspapivulnlab=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# SECURITY FIX: Do not log sensitive information
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# SECURITY FIX: Prevent logging of sensitive headers
server.servlet.session.tracking-modes=cookie
